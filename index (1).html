<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pure Expense Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#0B0F17;--card:#131A27;--line:#1E293B;--tx:#F8FAFC;--mu:#94A3B8;--bl:#2563EB;--bll:#60A5FA;--rd:#F87171;--or:#F97316;color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text!important;user-select:text!important}
html,body{touch-action:pan-x pan-y;overscroll-behavior:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif}
#app{max-width:430px;height:100%;margin:0 auto;position:relative;display:flex;flex-direction:column}
#main{flex:1;overflow-y:auto;padding:40px 20px 24px}
#foot{border-top:1px solid var(--line);background:#0F1420;padding:8px 12px 10px;display:flex;justify-content:space-around}
button{all:unset;cursor:pointer;box-sizing:border-box}
button:focus-visible,input:focus-visible{outline:2px solid var(--bll);outline-offset:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;min-height:48px;font-size:11px;font-weight:600;color:var(--mu)}
.tab.on{color:var(--bll)}
h1{font-size:24px;margin:0;font-weight:700}
.sub{font-size:13px;color:var(--mu);margin-top:2px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:14px}
.row{display:flex;align-items:center;gap:12px}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--mu)}
.hero{background:var(--bl);border-radius:22px;padding:18px 20px;margin-top:14px;color:#fff}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-top:14px}
.seg button{flex:1;text-align:center;height:36px;line-height:36px;border-radius:11px;font-size:13px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--bl);color:#fff}
.chip{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px;margin-top:8px}
.item b{font-size:14px;font-weight:600;display:block}.item small{font-size:12px;color:var(--mu)}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:8px}.bar i{display:block;height:8px;border-radius:4px}
.ib{width:44px;height:44px;border-radius:14px;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.fab{position:absolute;right:20px;bottom:92px;width:56px;height:56px;border-radius:18px;background:var(--bl);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px #0008}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--mu);min-height:44px}
.cat div{width:56px;height:56px;border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:center}
.cat.on{color:var(--bll)}.cat.on div{background:var(--bl);box-shadow:0 0 0 2px #93C5FD}.cl{max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:0 16px;height:52px;margin-top:10px;color:var(--mu)}
.field input{all:unset;flex:1;color:var(--tx);font:500 14px Inter,sans-serif;min-width:0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.keys button{height:46px;border-radius:12px;background:var(--card);text-align:center;line-height:46px;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center}
.save{flex:1;height:52px;border-radius:16px;background:var(--bl);color:#fff;text-align:center;line-height:52px;font-size:16px;font-weight:700}
.lim{width:72px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--tx);font:600 13px Inter,sans-serif;padding:6px 8px;text-align:right}
.mb{all:unset;flex:1;min-width:0;color:#fff;font:800 34px Inter,sans-serif;border-bottom:2px dashed #ffffff66;padding-bottom:2px}
.mb::placeholder{color:#ffffff99;font-size:22px;font-weight:700}
.mb::-webkit-outer-spin-button,.mb::-webkit-inner-spin-button,.lim::-webkit-outer-spin-button,.lim::-webkit-inner-spin-button,.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.sw.on{background:var(--bl)}.sw.on::after{left:23px}
.set{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
#toast{position:absolute;left:20px;right:20px;bottom:96px;z-index:30;background:#1E293B;border:1px solid #334155;border-radius:14px;padding:12px 16px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#abar{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;display:none}
.done{position:absolute;right:20px;bottom:92px;z-index:25;width:52px;height:52px;border-radius:26px;background:#16A34A;display:none;align-items:center;justify-content:center;box-shadow:0 6px 20px #0008}
</style></head>
<body><div id="app"><main id="main"></main><nav id="foot"></nav><div id="sheet"></div><div id="toast" role="status"></div><div id="abar"></div><button id="done" class="done" data-a="done" aria-label="Done"></button></div>
<script>
const $=s=>document.querySelector(s);
const IC={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',chart:'<path d="M5 21V11M12 21V4M19 21v-7"/>',wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7V6a2 2 0 0 1 2-2h12M16 14h2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',food:'<path d="M4 11h16a8 8 0 0 0-16 0zM4 15h16M5 19h14"/>',bus:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l1-4M16 21l-1-4"/>',bag:'<path d="M5 8h14l-1 13H6zM9 8a3 3 0 0 1 6 0"/>',bill:'<path d="M6 3h9l4 4v14H6zM9 12h6M9 16h6"/>',film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14M16 5v14M3 12h18"/>',heart:'<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/>',cap:'<path d="M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5"/>',back:'<path d="M15 6l-6 6 6 6"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/>',cal:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12l5 5L20 7"/>',bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',shield:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/>',tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/>'};
const I=(n,c='currentColor',s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const CATS0=[{k:'food',n:'Food',c:'#F97316',i:'food'},{k:'transit',n:'Transit',c:'#3B82F6',i:'bus'},{k:'shop',n:'Shop',c:'#EC4899',i:'bag'},{k:'bills',n:'Bills',c:'#10B981',i:'bill'},{k:'fun',n:'Entertain',c:'#8B5CF6',i:'film'},{k:'health',n:'Health',c:'#EF4444',i:'heart'},{k:'home',n:'Home',c:'#06B6D4',i:'home'},{k:'edu',n:'Edu',c:'#F59E0B',i:'cap'}];
let CATS=CATS0.slice();const CM={};const refreshCats=()=>{CATS=(S.cats||CATS0).slice();for(const k in CM)delete CM[k];CATS.forEach(c=>CM[c.k]=c)};
const ini=c=>(String(c.n||'?').trim()[0]||'?').toUpperCase();
const ci=(c,col,s)=>c.i&&IC[c.i]?I(c.i,col,s):`<span style="font-size:${Math.round(s*.85)}px;font-weight:800;line-height:1;color:${col}">${esc(ini(c))}</span>`;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const money=n=>'₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
/* Put your app download link here later (e.g. Play Store link). Leave '' for now. */
const SHARE_LINK='';
const shareMsg='Check out Pure Expense Tracker, a simple app to track your daily expenses and budget.'+(SHARE_LINK?' '+SHARE_LINK:'');
const waHref=()=>'https://wa.me/?text='+encodeURIComponent(shareMsg);
const mailHref=()=>'mailto:?subject='+encodeURIComponent('Pure Expense Tracker')+'&body='+encodeURIComponent(shareMsg);
/* Fresh storage key (pet3): old demo data from earlier versions is ignored */
let S={ex:[],bud:{},mb:0,alert:true,thr:80,name:'',onb:false,cats:null,photo:''};
try{const r=localStorage.getItem('pet3');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
/* Categories now live in S.cats so any of them can be added or removed. Older saves are converted here. */
if(!Array.isArray(S.cats)||!S.cats.length)S.cats=CATS0.map(c=>Object.assign({},c)).concat((S.custom||[]).map(c=>({k:c.k,n:c.n,c:c.c})));
delete S.custom;
const save=()=>{try{localStorage.setItem('pet3',JSON.stringify(S))}catch(e){}};
refreshCats();
let V='home',PH='Month',PS='Week',A=null,armed=false,CR=false,PI=false,AR=false,DC=null,NC={open:false,n:'',c:'#A3E635'};
function sheet(){const L=(href,ic,c,t,v,ex='')=>`<a class="item" href="${href}" ${ex} style="text-decoration:none;color:inherit;margin-top:10px;background:var(--bg)"><div class="chip" style="background:${c}26">${I(ic,c,20)}</div><div style="flex:1;min-width:0"><b>${t}</b><small>${v}</small></div></a>`;
 return `<button data-a="closecr" aria-label="Close" style="position:absolute;inset:0;background:#000A;z-index:10;cursor:default"></button><div role="dialog" aria-modal="true" aria-label="Cooked by Anas" style="position:absolute;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:24px 24px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px))"><div style="width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px"></div><div style="font-size:20px;font-weight:700">Cooked by Anas</div><div class="sub">Get in touch or follow along</div>${L('mailto:anasakhtar0110@gmail.com','mail','#60A5FA','Email','anasakhtar0110@gmail.com')}${L('https://instagram.com/anasakhtarr','ig','#EC4899','Instagram','@anasakhtarr','target="_blank" rel="noopener"')}<button data-a="closecr" class="save" style="display:block;margin-top:16px;background:var(--bg)">Close</button></div>`}
function nameModal(){return `<button data-a="closepi" aria-label="Close" style="position:absolute;inset:0;background:#000A;z-index:10;cursor:default"></button><div role="dialog" aria-modal="true" aria-label="Personal info" style="position:absolute;left:20px;right:20px;top:90px;z-index:11;background:var(--card);border-radius:24px;padding:20px"><div style="font-size:20px;font-weight:800;color:#fff">Personal info</div><div class="sub">This name is shown on your home screen</div><label class="field" style="background:var(--bg);margin-top:16px">${I('user','#94A3B8',20)}<input id="pname" value="${esc(S.name)}" placeholder="Your name" maxlength="24" autocomplete="off" aria-label="Your name" style="font-size:16px;font-weight:700;color:#fff"></label><div class="row" style="margin-top:16px"><button data-a="closepi" class="save" style="background:var(--bg)">Cancel</button><button data-a="pisave" class="save">Save</button></div></div>`}
function alertModal(){return `<button data-a="closear" aria-label="Close" style="position:absolute;inset:0;background:#000A;z-index:10;cursor:default"></button><div role="dialog" aria-modal="true" aria-label="Alert rules" style="position:absolute;left:20px;right:20px;top:90px;z-index:11;background:var(--card);border-radius:24px;padding:20px"><div style="font-size:20px;font-weight:800;color:#fff">Alert rules</div><div class="sub">Warn me when a category reaches this much of its limit</div><div class="row" style="flex-wrap:wrap;gap:8px;margin-top:16px">${[50,60,70,80,90,100].map(p=>`<button data-a="arp" data-v="${p}" style="padding:10px 14px;border-radius:12px;background:var(--bg);font-size:13px;font-weight:700;color:var(--tx)">${p}%</button>`).join('')}</div><label class="field" style="background:var(--bg);margin-top:14px"><input id="arval" type="number" inputmode="numeric" min="1" max="100" value="${S.thr}" aria-label="Alert percent" style="font-size:16px;font-weight:700;color:#fff"><span style="font-weight:700">%</span></label><div class="row" style="margin-top:16px"><button data-a="closear" class="save" style="background:var(--bg)">Cancel</button><button data-a="arsave" class="save">Save</button></div></div>`}
const SW=['#A3E635','#FACC15','#FB7185','#38BDF8','#C084FC','#2DD4BF','#FB923C','#E879F9'];
function newPanel(){return `<div class="card"><div class="lbl" style="margin-bottom:10px">NEW CATEGORY</div><label class="field" style="margin-top:0;border:1px solid #F8FAFC">${I('tag','#94A3B8',20)}<input id="ncname" placeholder="e.g. Pets, Gym, Gifts" maxlength="14" value="${esc(NC.n)}"></label><div class="row" style="gap:10px;margin:12px 0;flex-wrap:wrap">${SW.map(c=>`<button data-a="ncolor" data-c="${c}" aria-label="Color ${c}" aria-pressed="${NC.c==c}" style="width:36px;height:36px;border-radius:12px;background:${c};box-shadow:${NC.c==c?'0 0 0 3px #131A27,0 0 0 5px '+c:'none'}"></button>`).join('')}</div><button data-a="addcat" class="save" style="display:block;height:46px;line-height:46px">Add category</button><div class="lbl" style="margin:14px 0 8px">ALL CATEGORIES (TAP X TO REMOVE)</div><div class="row" style="flex-wrap:wrap;gap:8px">${CATS.map(c=>`<span class="row" style="gap:6px;background:var(--bg);border-radius:10px;padding:4px 4px 4px 10px;font-size:12px;font-weight:600;color:${c.c}">${esc(c.n)}<button data-a="delcat" data-c="${c.k}" aria-label="Delete ${esc(c.n)}" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center">${I('x',DC==c.k?'#F87171':'#94A3B8',14)}</button></span>`).join('')}</div></div>`}
function range(p,off=0){const t=today();let a,b;
 if(p=='Week'){a=new Date(t);a.setDate(t.getDate()-((t.getDay()+6)%7)+7*off);b=new Date(a);b.setDate(a.getDate()+7)}
 else if(p=='Month'){a=new Date(t.getFullYear(),t.getMonth()+off,1);b=new Date(t.getFullYear(),t.getMonth()+off+1,1)}
 else{a=new Date(t.getFullYear()+off,0,1);b=new Date(t.getFullYear()+off+1,0,1)}
 return [a,b]}
const dt=e=>new Date(e.d+'T00:00:00');
const inR=(e,[a,b])=>{const d=dt(e);return d>=a&&d<b};
const sum=l=>l.reduce((s,e)=>s+e.a,0);
const inP=(p,o=0)=>S.ex.filter(e=>inR(e,range(p,o)));
const byCat=l=>{const m={};l.forEach(e=>m[e.c]=(m[e.c]||0)+e.a);return m};
const seg=(cur,act)=>`<div class="seg">${['Week','Month','Year'].map(p=>`<button data-a="${act}" data-p="${p}" class="${p==cur?'on':''}">${p}</button>`).join('')}</div>`;
function donut(bc,tot){const sz=132,r=50,m=sz/2,C=2*Math.PI*r;let off=0;
 let s=`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" role="img" aria-label="Spending by category"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="#1E293B" stroke-width="16"/><g transform="rotate(-90 ${m} ${m})">`;
 CATS.forEach(c=>{const v=bc[c.k]||0;if(!v)return;const L=C*v/tot;s+=`<circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="${c.c}" stroke-width="16" stroke-dasharray="${Math.max(L-2,1).toFixed(1)} ${(C-L+2).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"/>`;off+=L});
 return s+`</g><text x="${m}" y="${m}" text-anchor="middle" font-size="19" font-weight="800" fill="#F8FAFC" font-family="Inter,sans-serif">${tot>=100000?'₹'+(tot/100000).toFixed(1)+'L':tot>=1000?'₹'+(tot/1000).toFixed(1)+'k':'₹'+Math.round(tot)}</text><text x="${m}" y="${m+16}" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8" font-family="Inter,sans-serif">SPENT</text></svg>`}
const when=d=>{const t=ymd(today()),y=new Date();y.setDate(y.getDate()-1);return d==t?'Today':d==ymd(y)?'Yesterday':new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})};
const item=e=>{const c=CM[e.c]||{n:'Other',c:'#94A3B8'};return `<div class="item"><div class="chip" style="background:${c.c}26">${ci(c,c.c,20)}</div><div style="flex:1;min-width:0"><b>${esc(e.n||c.n)}</b><small>${c.n} · ${when(e.d)}</small></div><div style="font-size:14px;font-weight:700;color:var(--rd)">-${money(e.a)}</div><button class="ib" style="width:36px;height:36px;border-radius:10px;background:transparent" data-a="del" data-id="${e.id}" aria-label="Delete expense">${I('x','#94A3B8',16)}</button></div>`};
function welcome(){return `<div style="padding-top:12vh"><div style="width:72px;height:72px;border-radius:22px;background:var(--bl);display:flex;align-items:center;justify-content:center">${I('wallet','#fff',34)}</div><h1 style="font-size:30px;font-weight:800;margin-top:24px;color:#fff">Welcome to Pure Expense Tracker</h1><div class="sub" style="font-size:15px;margin-top:8px">Let's get started. What should we call you?</div><label class="field" style="margin-top:24px">${I('user','#94A3B8',20)}<input id="wname" placeholder="Your name" maxlength="24" autocomplete="off" style="font-size:16px;font-weight:600"></label><button data-a="wsave" class="save" style="display:block;margin-top:16px">Continue</button></div>`}
function syncNative(){try{if(!window.Android||!Android.saveBudget)return;const m=byCat(inP('Month'));Android.saveBudget(JSON.stringify({on:S.alert,thr:S.thr,month:ymd(today()).slice(0,7),mb:+S.mb||0,spent:sum(inP('Month')),cats:CATS.map(c=>({n:c.n,limit:+S.bud[c.k]||0,spent:m[c.k]||0}))}))}catch(e){}}
function alerts(){if(!S.alert)return[];const o=[],mb=+S.mb||0,bc=byCat(inP('Month')),tsp=sum(inP('Month'));
 if(mb&&tsp/mb*100>=S.thr)o.push(tsp>mb?'You are over your monthly budget ('+money(tsp)+' of '+money(mb)+')':'You have used '+Math.round(tsp/mb*100)+'% of your monthly budget ('+money(tsp)+' of '+money(mb)+')');
 CATS.forEach(c=>{const l=+S.bud[c.k]||0,x=bc[c.k]||0;if(l&&x/l*100>=S.thr)o.push(esc(c.n)+': '+Math.round(x/l*100)+'% of its limit ('+money(x)+' of '+money(l)+')')});return o}
const alertBox=()=>{const a=alerts();return a.length?`<div role="alert" style="margin-top:14px;background:#431407;border:1px solid #9A3412;border-radius:16px;padding:12px 14px"><div style="font-size:13px;font-weight:700;color:#FDBA74;margin-bottom:6px">Budget alert (at ${S.thr}%)</div>${a.map(t=>`<div style="font-size:13px;line-height:1.5;color:#FED7AA">${t}</div>`).join('')}</div>`:''};

$('#done').innerHTML=I('check','#fff',26);
/* Keep the keyboard open while the tick button is pressed, so the change is saved by the tap itself */
['pointerdown','mousedown','touchstart'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('#done'))e.preventDefault()},{passive:false}));
render();
</script></body></html>
